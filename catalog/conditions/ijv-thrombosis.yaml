id: ijv-thrombosis
name: "Internal jugular vein thrombosis (VTE)"
hazard: gravity
hrpRisk: "Cardiovascular adaptations (HRP); NASA VTE risk score"
hrpRiskUrl: "https://www.nasa.gov/hrp/risks/"
# Clinical codes (docs/technical/10 §5.4). Checked on tx.fhir.org and NLM Clinical Tables, 2026-11-15.
codes:
  - { system: snomed, code: "128053003", display: Deep venous thrombosis, equivalence: wider }
  - {
      system: icd10cm,
      code: "I82.C1",
      display: "Acute embolism and thrombosis of internal jugular vein",
      equivalence: narrower,
      note: "Acute only. Laterality is coded at confirmation, for example I82.C12 (left).",
    }
supports:
  [
    f-prior-ijv-flow-abnormal,
    f-ijv-flow-abnormal,
    f-ijv-thrombus,
    f-ijv-noncompressible,
    f-neck-swelling,
    f-clotting-history,
    f-sleeping-hr-up,
  ]
against: [f-ijv-no-thrombus]
questions: [q-neck, q-dyspnea, q-chest-pain, q-headache-vision, q-meds, q-clotting-history]
# Step 5 of Demo 1 first (vital signs), then the targeted ultrasound.
tests: [t-repeat-rest-hr, t-bp, t-spo2, t-ultrasound-ijv]
actions:
  - id: a-escalate-vte
    text: "Escalate to the crew medical officer and the ground: suspected IJV thrombosis. Start the mission-approved thrombosis evaluation pathway and schedule a repeat ultrasound. Anticoagulation needs authorized medical oversight."
    escalates: true
followUpDays: 30
# Demo 1 step 1: an abnormal IJV flow finding at the L+30 screening keeps the L+60 screening on
# schedule (NASA/SP-20250001074: in-flight screening at L+30 and L+60 days). Bringing it forward
# on a silent watch is ORBIVIT's design (earlyOnWatch).
surveillance:
  recordFinding: f-prior-ijv-flow-abnormal
  repeatWithinDays: 30
  earlyOnWatch: true
  sourceId: nasa-vte-sp-2025
sourceIds: [nasa-hrp-risks, nasa-vte-risk-score, nasa-vte-sp-2025, catalog-draft]
