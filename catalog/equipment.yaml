# Onboard devices and their tests. returns: the measures a test records (catalog/measures.yaml).
# Result rules: field (a returned measure), op (lt|gt|eq), value → findings.
# Form fields are returned measures; a select takes its options from the measure.
equipment:
  - id: wearable
    name: "Wearable monitor (HR, HRV, respiration, skin temperature, SpO2, activity)"
    consumable: false
    tests:
      - {
          id: t-repeat-rest-hr,
          name: "Repeat resting heart rate",
          returns: [resting-hr],
          rules:
            [
              { field: resting-hr, op: gt, value: 90, finding: f-resting-hr-high },
              { field: resting-hr, op: lt, value: 90, finding: f-resting-hr-in-band },
            ],
        }
      - {
          id: t-spo2,
          name: "SpO2 at rest",
          returns: [spo2],
          rules:
            [
              { field: spo2, op: lt, value: 92, finding: f-spo2-low },
              { field: spo2, op: gt, value: 94, finding: f-spo2-normal },
            ],
        }
  - id: bp-cuff
    name: "Blood pressure cuff"
    consumable: false
    tests:
      - {
          id: t-bp,
          name: "Blood pressure",
          returns: [systolic-bp, diastolic-bp],
          rules:
            [
              { field: systolic-bp, op: lt, value: 95, finding: f-bp-low },
              { field: systolic-bp, op: gt, value: 95, finding: f-bp-normal },
            ],
        }
  - id: thermometer
    name: "Thermometer"
    consumable: false
    tests:
      - {
          id: t-temp,
          name: "Body temperature",
          returns: [body-temperature],
          rules:
            [
              { field: body-temperature, op: gt, value: 37.9, finding: f-fever },
              { field: body-temperature, op: lt, value: 37.5, finding: f-no-fever },
            ],
        }
  - id: ecg
    name: "12-lead ECG"
    consumable: false
    tests:
      - {
          id: t-ecg,
          name: "ECG",
          returns: [ecg-rhythm, ecg-heart-rate, ecg-arrhythmia],
          rules:
            [
              { field: ecg-arrhythmia, op: eq, value: true, finding: f-ecg-arrhythmia },
              { field: ecg-arrhythmia, op: eq, value: false, finding: f-ecg-normal },
            ],
        }
  - id: cycle-ergometer
    name: "Cycle ergometer"
    consumable: false
    tests:
      - {
          id: t-std-exercise-test,
          name: "Standardized submaximal exercise test",
          returns: [exercise-workload, standard-exercise-hr],
          rules:
            [
              {
                field: standard-exercise-hr,
                op: gt,
                value: 135,
                finding: f-exercise-hr-up-confirmed,
              },
            ],
        }
  - id: mass-device
    name: "Body mass measurement device (SLAMMD on the ISS)"
    consumable: false
    tests:
      - {
          id: t-body-mass,
          name: "Body mass",
          returns: [body-mass-change],
          sourceIds: [nasa-iss-slammd],
          rules: [{ field: body-mass-change, op: lt, value: -1.5, finding: f-body-mass-down }],
        }
  - id: urine-chart
    name: "Urine color chart"
    consumable: false
    tests:
      - {
          id: t-urine-color,
          name: "Urine color",
          returns: [urine-color],
          rules: [{ field: urine-color, op: gt, value: 5, finding: f-urine-dark }],
        }
  - id: istat
    name: "Handheld blood analyzer (i-STAT, in the ISS vascular contingency kit)"
    consumable: true
    tests:
      - {
          id: t-istat-chem8,
          name: "Fingerstick chemistry and hematocrit cartridge",
          returns: [sodium-blood, urea-nitrogen-blood, creatinine-blood, hematocrit-blood],
          sourceIds: [nasa-vte-sp-2025],
          rules:
            [
              { field: sodium-blood, op: gt, value: 145, finding: f-sodium-high },
              { field: urea-nitrogen-blood, op: gt, value: 25, finding: f-bun-high },
              { field: hematocrit-blood, op: gt, value: 50, finding: f-hematocrit-high },
              { field: hematocrit-blood, op: lt, value: 38, finding: f-hematocrit-low },
              { field: hematocrit-blood, op: gt, value: 38, finding: f-hematocrit-normal },
            ],
        }
  - id: ultrasound
    name: "Ultrasound with operator checklist"
    consumable: false
    tests:
      - {
          id: t-ultrasound-renal,
          name: "Kidney ultrasound (structured finding)",
          returns: [kidney-hydronephrosis],
          rules: [{ field: kidney-hydronephrosis, op: eq, value: true, finding: f-hydronephrosis }],
        }
      # Flow grades 1–4 from Marshall-Goebel 2019, Figure 3A. The checklist is a draft (verify).
      - id: t-ultrasound-ijv
        name: "Internal jugular vein ultrasound (structured finding)"
        returns: [ijv-flow-detected, ijv-flow-grade, ijv-compressible, ijv-thrombus]
        sourceIds: [marshall-goebel-2019, catalog-draft]
        checklist:
          - "Trained crew member operates; remote guidance from the ground if the link allows."
          - "Astronaut restrained supine, head neutral. Linear probe on the left side of the neck."
          - "Transverse view of the left IJV at mid-neck, next to the carotid artery."
          - "Compress gently with the probe: a normal vein collapses completely."
          - "Longitudinal view: pulsed-wave Doppler, record the flow velocity waveform."
          - "Look for echogenic material in the vein. Save the images."
          - "Repeat on the right IJV. Enter the structured finding for the left IJV."
        form:
          - { field: ijv-flow-detected, label: "Doppler flow detected", kind: boolean }
          - { field: ijv-flow-grade, label: "Flow grade (if flow is detected)", kind: select }
          - { field: ijv-compressible, label: "Vein fully compressible", kind: boolean }
          - { field: ijv-thrombus, label: "Thrombus seen", kind: boolean }
        rules:
          - { field: ijv-thrombus, op: eq, value: true, finding: f-ijv-thrombus }
          - { field: ijv-flow-grade, op: gt, value: 2, finding: f-ijv-flow-abnormal }
          - { field: ijv-flow-detected, op: eq, value: false, finding: f-ijv-flow-abnormal }
          - { field: ijv-compressible, op: eq, value: false, finding: f-ijv-noncompressible }
          - { field: ijv-thrombus, op: eq, value: false, finding: f-ijv-no-thrombus }
  - id: cognition
    name: "Tablet tests (reaction time, vision check)"
    consumable: false
    tests:
      - {
          id: t-vision-check,
          name: "Near-vision acuity and Amsler grid on the tablet",
          returns: [vision-change],
          rules: [{ field: vision-change, op: eq, value: true, finding: f-vision-change }],
        }
      - {
          id: t-reaction-time,
          name: "Psychomotor vigilance test",
          returns: [reaction-time-slowing],
          rules: [{ field: reaction-time-slowing, op: gt, value: 15, finding: f-cognition-slow }],
        }
  - id: cabin-sensors
    name: "Cabin environment sensors"
    consumable: false
    tests:
      - {
          id: t-cabin-co2,
          name: "Cabin CO2 reading",
          returns: [cabin-ppco2],
          sourceIds: [nasa-std-3001-vol2-revf],
          # NASA-STD-3001 Vol. 2 Rev F [V2 6004]: one-hour average ppCO2 no more than 3 mmHg.
          rules: [{ field: cabin-ppco2, op: gt, value: 3, finding: f-co2-high }],
        }
      - {
          id: t-dosimeter,
          name: "Personal dosimeter reading",
          returns: [absorbed-dose-recent],
          rules:
            [{ field: absorbed-dose-recent, op: gt, value: 100, finding: f-radiation-dose-high }],
        }
