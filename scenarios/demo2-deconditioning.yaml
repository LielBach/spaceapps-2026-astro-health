# Main demo — cardiovascular deconditioning (docs/product/08-clinical-demos.md, ADR 0012).
# The id keeps the old name demo2 so tests and recorded runs do not change.
# Alex = subject 1 of NLSP 178066 (REAL resting values). Everything in the stream is SIMULATED.
id: demo2-deconditioning
title: "Main demo — Early detection of cardiovascular deconditioning before Mars landing"
seed: 2026
astronaut:
  id: nlsp178066-s1
  displayName: Alex
  anchorSources: [nlsp-178066]
mission:
  name: Mars transit
  lengthDays: 150
  replayFromDay: 90
  commDelayMinutes: 20
  # Fictional launch time (SIMULATED): only the FHIR export uses it, for ISO 8601 timestamps.
  epoch: "2035-01-01T00:00:00Z"
stream:
  sampleEveryHours: 1
  sleepHours: [22, 6]
  exercise:
    standardSessionHour: 10
    standardWorkloadWatts: 100
    maxTestEveryDays: 7
    maxTestBaselineWatts: 200
  baselines:
    hr:
      {
        value: { anchor: { measure: heart-rate, condition: inflight } },
        noiseSd: 2,
        sourceId: nlsp-178066,
      }
    # HRV: the published in-flight group mean of 5-minute SDNN (SDNNIDX, Otsuka 2019, Table 2),
    # not this astronaut's own value. The noise is illustrative.
    hrv: { value: 63, noiseSd: 6, sourceId: otsuka-2019-hrv }
    respiratoryRate: { value: 14, noiseSd: 1, sourceId: illustrative }
    skinTemp: { value: 33.5, noiseSd: 0.2, sourceId: illustrative }
    spo2: { value: 98, noiseSd: 0.5, sourceId: illustrative }
  sleepHrDrop: 8
  # 66 bpm × 1.9 ≈ 125 bpm at the standard workload (08 doc, illustrative).
  exerciseHrRatio: 1.9
drifts:
  - signal: exerciseHr
    context: exercise-standard
    fromDay: 100
    toDay: 118
    delta: 18
    reversedBy: { action: a-countermeasure-review, overDays: 14 }
  - signal: exerciseWorkload
    context: exercise-max
    fromDay: 100
    toDay: 118
    delta: -36
    reversedBy: { action: a-countermeasure-review, overDays: 14 }
spikes:
  - signal: hr
    day: 95.5
    hours: 2
    delta: 45
    context: exercise-free
    note: "Extra unscheduled workout (benign)"
  - signal: hr
    day: 97.6
    hours: 1
    delta: 22
    context: rest
    note: "Excitement during a docking-style event (benign)"
answers:
  default: "no"
  byQuestion:
    q-fatigue: "Mild new fatigue after exercise, harder to finish the session"
    q-fluid-intake: "Less than usual"
# Scripted results of active tests, keyed by test ID, then by measure ID (catalog/measures.yaml).
testResults:
  t-repeat-rest-hr: { resting-hr: 67 }
  t-bp: { systolic-bp: 118, diastolic-bp: 72 }
  t-spo2: { spo2: 98 }
  t-temp: { body-temperature: 36.7 }
  t-ecg: { ecg-rhythm: "sinus rhythm", ecg-heart-rate: 68, ecg-arrhythmia: false }
  t-std-exercise-test: { exercise-workload: 100, standard-exercise-hr: 144 }
  t-body-mass: { body-mass-change: -0.4 }
  t-urine-color: { urine-color: 3 }
  t-istat-chem8:
    { sodium-blood: 140, urea-nitrogen-blood: 17, creatinine-blood: 0.9, hematocrit-blood: 44 }
# Presenter mode: the storyline of the main demo (docs/product/08-clinical-demos.md, "Storyline").
# Next runs the moves of a beat; Back replays from a fresh session. Talking points stay short.
story:
  - title: "Meet Alex: day 90 of a Mars transit"
    say:
      - "Alex is a real Shuttle astronaut: subject 1 of NASA study NLSP 178066. Resting heart rate and BP are REAL."
      - "Alex feels healthy. A wearable and the exercise device record data with no action from Alex."
      - "The long-mission stream is SIMULATED from published effect sizes. Each value is labeled."
    focus: []
  - title: "A benign spike is ignored"
    say:
      - "An extra workout on day 95 and an exciting event on day 97 raise heart rate."
      - "ORBIVIT ignores both: the workout is explained by context, and the second is one short spike."
      - "No alert reaches Alex. ORBIVIT does not overreact."
    focus: [charts]
    do: [{ advanceTo: 98 }]
  - title: "A slow trend that Alex does not feel"
    say:
      - "Heart rate at the same standard workload climbs session by session."
      - "The weekly maximum workload falls."
      - "The personal baseline comes from Alex's REAL in-flight heart rate."
      - "On day 111 the first signal deviates. ORBIVIT starts a silent watch and does not contact Alex yet."
    focus: [charts]
    do: [{ advanceTo: 117 }]
  - title: "A meaningful deviation from Alex's baseline"
    say:
      - "The deviation persists, and two signals agree: higher exercise heart rate, lower performance."
      - "ORBIVIT opens an event by itself. It is a check-in, not an alarm: the trend took weeks."
    focus: [charts, review]
    do: [{ advanceUntil: event }]
  - title: "Targeted questions"
    say:
      - "Red flags first: chest pain, fainting, breathlessness. All no."
      - "Then context: Alex reports mild new fatigue and less fluid than usual."
    focus: [tablet]
    do: [{ stepUntil: test }]
  - title: "Cardiovascular and functional tests"
    say:
      - "The standardized exercise test confirms a higher heart rate at the same workload."
      - "BP and ECG check for other causes: normal sinus rhythm, no arrhythmia."
      - "ORBIVIT ranks suspected deconditioning first and weighs other causes, such as space anemia."
      - "Suspected only: the crew medical officer confirms."
    focus: [tablet, review]
    do: [{ stepUntil: action }]
  - title: "An approved, personalized plan"
    say:
      - "ORBIVIT recommends a review of the exercise countermeasure program, from an approved pathway."
      - "The crew medical officer approves. ORBIVIT never prescribes medication or doses."
    focus: [review, tablet]
    do: [{ approve: true }]
  - title: "Monitoring the response"
    say:
      - "Exercise heart rate and performance return toward baseline over the next weeks."
      - "ORBIVIT closes the event. If the data had not recovered, it would escalate."
    focus: [charts, log]
    do: [{ advanceUntil: closed }]
  - title: "Ready for Mars landing, and ready for emergencies"
    say:
      - "Found early, the decline is fixed weeks before landing, when Alex must function in gravity."
      - "The same loop handles urgent events, such as arrhythmias: red-flag questions, ECG, immediate escalation."
      - "Decision support only: every number links to its source."
    focus: []
